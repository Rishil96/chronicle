{% extends 'base.html' %}

{% block title %}
    Change Password | Chronicle
{% endblock %}

{% block content %}
    <div class="max-w-4xl mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold text-sky-600 mb-8">Change Password</h1>
        {% include "_flash_message.html" %}
        <form method="POST" action="{{ url_for('change_password_form') }}">
            <div class="mb-6">
                <label for="old-password" class="text-lg text-sky-700 font-medium mb-1 block">Old Password</label>
                <input type="password" id="old-password" name="old_password" class="border border-sky-300 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-sky-500" required>
            </div>
            <div class="mb-6">
                <label for="new-password" class="text-lg text-sky-700 font-medium mb-1 block">New Password</label>
                <input type="password" id="new-password" name="new_password" class="border border-sky-300 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-sky-500" required>
            </div>
            <div class="mb-6">
                <label for="repeat-new-password" class="text-lg text-sky-700 font-medium mb-1 block">Repeat New Password</label>
                <input type="password" id="repeat-new-password" name="repeat_new_password" class="border border-sky-300 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-sky-500" required>
            </div>
            <button type="submit" class="bg-sky-500 text-white px-6 py-2 w-full rounded-lg font-medium hover:bg-sky-600 cursor-pointer mt-4">Submit</button>
        </form>
    </div>
{% endblock %}
