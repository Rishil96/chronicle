{% extends 'base.html' %}

{% block title %}
Add Project Log | Chronicle
{% endblock %}

{% block content %}
    <div class="max-w-4xl mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold text-emerald-600 mb-8">Add Project Log</h1>
        <form method="POST" action="">
            <div class="mb-6">
                <label for="project" class="text-lg text-emerald-700 font-medium mb-1 block">Project</label>
                <select name="project_id" id="project" class="border border-emerald-300 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    {% for project in all_projects %}
                        <option value="{{ project.id }}">{{ project.project_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-6">
                <label for="project-log" class="text-lg text-emerald-700 font-medium mb-1 block">Work Log</label>
                <textarea name="log" id="project-log" rows="6" class="border border-emerald-300 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-y"></textarea>
            </div>
            <button type="submit" class="bg-emerald-500 text-white px-6 py-2 w-full rounded-lg font-medium hover:bg-emerald-600 cursor-pointer mt-4">Add Project Log</button>
        </form>
    </div>
{% endblock %}
