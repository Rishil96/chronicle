{% extends 'base.html' %}

{% block title %}
Add Daily Update | Chronicle
{% endblock %}

{% block content %}
    <div class="max-w-4xl mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold text-emerald-600 mb-8">Add Daily Update</h1>
        <form method="POST" action="{{ url_for('add_daily_update') }}">
            <div class="mb-6">
                <label for="category" class="text-lg text-emerald-700 font-medium mb-1 block">Category</label>
                <input type="text" id="category" name="category" list="categories" class="border border-emerald-300 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <datalist id="categories">
                    {% for category in categories %}
                        <option value="{{ category.category_name }}"></option>
                    {% endfor %}
                </datalist>
            </div>
            <div class="mb-6">
                <label for="summary" class="text-lg text-emerald-700 font-medium mb-1 block">Summary</label>
                <input type="text" name="summary" id="summary" class="border border-emerald-300 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div class="mb-6">
                <label for="description" class="text-lg text-emerald-700 font-medium mb-1 block">Description</label>
                <textarea name="description" id="description" rows="6" class="border border-emerald-300 rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-y"></textarea>
            </div>
            <button type="submit" class="bg-emerald-500 text-white px-6 py-2 w-full rounded-lg font-medium hover:bg-emerald-600 cursor-pointer mt-4">Make Entry</button>
        </form>
    </div>
{% endblock %}
