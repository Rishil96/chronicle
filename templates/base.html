<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <nav class="bg-sky-500 text-white p-4 flex items-center justify-between">
      <span class="font-bold text-3xl">Chronicle</span>
      <div class="flex gap-6 pr-4">
          <a href="{{ url_for('home_page') }}" class="font-medium text-lg hover:text-sky-100">Home</a>
          <a href="{{ url_for('all_work_updates') }}" class="font-medium text-lg hover:text-sky-100">Work Updates</a>
          <div class="relative group">
              <button class="bg-white text-sky-600 font-bold w-9 h-9 rounded-full pb-2 flex items-center justify-center cursor-pointer">{{ request.state.initials }}</button>
              <div class="absolute right-0 pt-2 w-48 bg-white rounded-lg shadow-lg hidden group-hover:block">
                  <a href="#" class="block px-4 py-2 text-slate-700 hover:bg-sky-50 rounded-t-lg">Change Password</a>
                  <a href="{{ url_for('logout') }}" class=" block px-4 py-2 text-slate-700 hover:bg-sky-50 rounded-b-lg">Logout</a>
              </div>
          </div>
      </div>
  </nav>
  <div class="bg-slate-50 min-h-screen">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
