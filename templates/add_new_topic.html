{% extends 'base.html' %}

{% block title %}
Add Project Log | Chronicle
{% endblock %}

{% block content %}
    <div class="max-w-4xl mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold text-brand mb-8">Add New Topic</h1>
        <form method="POST" action="{{ url_for('new_topic') }}">
            <div class="mb-6">
                <label for="topic" class="text-lg text-brand-dark font-medium mb-1 block">Topic Name</label>
                <input type="text" id="topic" name="topic_name" class="border border-brand-line rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-brand-accent" required>
            </div>
            <div class="mb-6">
                <label for="description" class="text-lg text-brand-dark font-medium mb-1 block">Description</label>
                <textarea name="description" id="description" rows="6" class="border border-brand-line rounded-lg px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-brand-accent resize-y" required></textarea>
            </div>
            <button type="submit" class="bg-brand text-white px-6 py-2 w-full rounded-lg font-medium hover:bg-brand-dark cursor-pointer mt-4">Add Topic</button>
        </form>
    </div>
{% endblock %}
