{% extends "base.html" %}

{% block title %}
    {{ name }}'s Home | Chronicle
{% endblock %}

{% block content %}
    <div class="max-w-4xl mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold text-emerald-600 mb-2"> {{ greeting }} </h1>
        <p class="text-lg text-emerald-600 mb-6"> {{ today_date }} </p>
    </div>
    <div class="flex gap-4 mb-8 justify-center">
        <a href="{{ url_for('daily_update_page') }}" class="bg-emerald-500 text-white px-6 py-3 rounded-lg font-medium hover:bg-emerald-600 cursor-pointer">Add Daily Update</a>
        <a href="{{ url_for('project_log_page') }}" class="bg-emerald-500 text-white px-6 py-3 rounded-lg font-medium hover:bg-emerald-600 cursor-pointer">Add Project Log</a>
    </div>
{% endblock %}
