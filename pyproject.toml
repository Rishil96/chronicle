[project]
name = "chronicle"
version = "1.0.0"
description = "Chronicle is a Web application + Command line interface tool used to track daily logs related to work and other stuff."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.135.2",
    "itsdangerous>=2.2.0",
    "openai>=2.30.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.15.0",
    "sqlalchemy>=2.0.48",
    "starlette>=1.0.0",
    "typer>=0.24.1",
    "tzdata>=2025.3",
]

[project.scripts]
chronicle = "src.cli.cli_tools:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
