[project]
name = "chronicle"
version = "2.0.0"
description = "Chronicle is a team work-update tracker built with FastAPI, SQLAlchemy and HTMX."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.135.2",
    "itsdangerous>=2.2.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.15.0",
    "sqlalchemy>=2.0.48",
    "starlette>=1.0.0",
    "tzdata>=2025.3",
]
