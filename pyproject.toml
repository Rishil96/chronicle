[project]
name = "chronicle"
version = "0.1.0"
description = "Chronicle is a Web application + Command line interface tool used to track daily logs related to work and other stuff."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.2",
    "openai>=2.30.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.48",
    "typer>=0.24.1",
    "tzdata>=2025.3",
]

[project.scripts]
chronicle = "src.cli.cli_tools:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
